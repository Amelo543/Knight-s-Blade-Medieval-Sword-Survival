<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Knight's Blade</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1022;color:#fff;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;pointer-events:none;text-shadow:0 2px 4px #000;font-weight:700}#health{width:150px;height:16px;background:#3b2532;border:2px solid #fff7;border-radius:9px;overflow:hidden}#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#f33,#fa7)}#overlay{position:fixed;inset:0;background:#080b1cdd;display:grid;place-content:center;text-align:center;padding:25px}h1{font-size:clamp(36px,7vw,72px);margin:0;color:#ffd47c}button{cursor:pointer;border:1px solid #e9c57a;background:#352844;color:white;border-radius:12px;padding:12px 20px;font-size:18px;font-weight:700}button:active{background:#81613e}#controls{position:fixed;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#controls>div{display:flex;gap:8px}#controls button{pointer-events:auto;touch-action:none;width:58px;height:58px;padding:0;background:#292e52cc;user-select:none}#controls button.attack{width:76px;background:#803b45dd}#pickup{position:fixed;bottom:94px;left:50%;transform:translateX(-50%);display:none;background:#202a47ed}small{opacity:.8}#bossbar{display:none;position:fixed;top:60px;left:25%;width:50%;height:16px;background:#321;border:1px solid #fff}#bossfill{height:100%;background:#b52;width:100%}</style></head><body>
<canvas id="game"></canvas><div id="hud"><span>❤️</span><div id="health"><div id="hpfill"></div></div><span id="score">คะแนน 0</span><span id="weapon">⚔️ Iron Sword</span><span id="time">0:00</span></div><div id="bossbar"><div id="bossfill"></div></div><button id="pickup">E เก็บอาวุธ</button><div id="controls"><div><button data-key="left">◀</button><button data-key="right">▶</button></div><div><button data-key="jump">↑</button><button data-key="dash">⇢</button><button class="attack" data-key="attack">⚔️</button><button data-key="pickup">E</button></div></div><div id="overlay"><h1>KNIGHT'S BLADE</h1><p>อัศวินฟันดาบ • เก็บอาวุธสุ่ม • เอาชีวิตรอด</p><p> A / D เดิน • Space กระโดด • J ฟัน • K พุ่ง • E เก็บ</p><button id="start">เริ่มเกม</button><p><small>รองรับคีย์บอร์ดและปุ่มสัมผัส</small></p></div>
<script>
(()=>{'use strict';
const storageKey='knightAudioPrefs';
let prefs={music:true,sfx:true,volume:.45};
try{prefs={...prefs,...JSON.parse(localStorage.getItem(storageKey)||'{}')}}catch{}
prefs.music=prefs.music!==false;prefs.sfx=prefs.sfx!==false;prefs.volume=Math.max(0,Math.min(1,Number(prefs.volume)||0));
let audioContext=null,master=null,musicBus=null,sfxBus=null,noiseBuffer=null,scheduler=null,nextStepTime=0,stepIndex=0,gameActive=false,bossMode=false,pendingBoss=null,sfxVoices=0;
const musicPatterns=[
 [0,null,7,null,10,null,7,null,3,null,7,null,10,12,10,null],
 [3,null,10,null,12,null,10,null,7,null,10,null,12,15,12,null],
 [7,null,12,null,15,null,12,null,10,null,12,null,15,17,15,null],
 [5,null,10,null,14,null,10,null,7,null,10,null,14,12,10,null]
];
const bossPatterns=[
 [0,7,null,10,12,null,10,7,3,null,7,10,12,15,12,null],
 [3,10,null,12,15,null,12,10,7,null,10,12,15,17,15,null],
 [7,12,null,15,19,null,15,12,10,null,12,15,17,19,17,null],
 [5,10,null,14,17,null,14,10,7,null,10,14,15,17,14,null]
];
const midiHz=midi=>440*Math.pow(2,(midi-69)/12);
function savePrefs(){try{localStorage.setItem(storageKey,JSON.stringify(prefs))}catch{}}
function updateControls(){musicButton.textContent=`Music: ${prefs.music?'ON':'OFF'}`;musicButton.setAttribute('aria-pressed',String(prefs.music));sfxButton.textContent=`SFX: ${prefs.sfx?'ON':'OFF'}`;sfxButton.setAttribute('aria-pressed',String(prefs.sfx));volumeSlider.value=String(Math.round(prefs.volume*100))}
const panel=document.createElement('div');panel.id='audioControls';panel.setAttribute('aria-label','Audio settings');
panel.innerHTML='<button type="button" id="musicToggle"></button><button type="button" id="sfxToggle"></button><label for="masterVolume">VOL</label><input id="masterVolume" type="range" min="0" max="100" step="1" aria-label="Master volume">';
const style=document.createElement('style');style.textContent='#audioControls{position:fixed;top:82px;right:12px;z-index:5;display:flex;align-items:center;gap:5px;padding:5px 7px;background:#11182ded;border:1px solid #ffffff45;border-radius:7px;box-shadow:0 3px 12px #0008;color:#fff;font:700 11px system-ui,sans-serif;pointer-events:auto}#audioControls button{min-height:29px;padding:5px 7px;border:1px solid #e9c57a;border-radius:4px;background:#292e52;color:#fff;font:700 11px system-ui,sans-serif}#audioControls button[aria-pressed="false"]{opacity:.62}#audioControls input{width:76px;margin:0;accent-color:#ffd47c}#audioControls label{opacity:.8}@media(max-width:480px){#audioControls{top:78px;right:8px;gap:3px;padding:4px}#audioControls button{padding:4px 5px;font-size:10px}#audioControls input{width:54px}}';
document.head.append(style);document.body.append(panel);
const musicButton=panel.querySelector('#musicToggle'),sfxButton=panel.querySelector('#sfxToggle'),volumeSlider=panel.querySelector('#masterVolume');
updateControls();
function createAudio(){if(audioContext)return true;const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return false;try{audioContext=new AudioContextClass();master=audioContext.createGain();musicBus=audioContext.createGain();sfxBus=audioContext.createGain();master.gain.value=prefs.volume;musicBus.gain.value=0.0001;sfxBus.gain.value=.58;musicBus.connect(master);sfxBus.connect(master);master.connect(audioContext.destination);noiseBuffer=audioContext.createBuffer(1,audioContext.sampleRate,audioContext.sampleRate);const data=noiseBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;return true}catch{return false}}
function unlock(){if(!createAudio())return;try{if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});if(gameActive&&prefs.music)startMusic()}catch{}}
document.addEventListener('pointerdown',unlock,{capture:true,passive:true});document.addEventListener('keydown',unlock,{capture:true});
function scheduleTone(midi,time,duration,wave='square',level=.08,bus=musicBus,endMidi=null){if(!audioContext||bus===sfxBus&&sfxVoices>=22)return;const oscillator=audioContext.createOscillator(),envelope=audioContext.createGain();oscillator.type=wave;oscillator.frequency.setValueAtTime(midiHz(midi),time);if(endMidi!==null)oscillator.frequency.exponentialRampToValueAtTime(midiHz(endMidi),time+duration);envelope.gain.setValueAtTime(.0001,time);envelope.gain.linearRampToValueAtTime(level,time+.006);envelope.gain.exponentialRampToValueAtTime(.0001,time+duration);oscillator.connect(envelope);envelope.connect(bus);if(bus===sfxBus){sfxVoices++;oscillator.onended=()=>{sfxVoices=Math.max(0,sfxVoices-1);oscillator.disconnect();envelope.disconnect()}}oscillator.start(time);oscillator.stop(time+duration+.015)}
function scheduleNoise(time,duration,level,filterType='highpass',frequency=1000){if(!audioContext||sfxVoices>=22)return;const source=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),envelope=audioContext.createGain();source.buffer=noiseBuffer;filter.type=filterType;filter.frequency.setValueAtTime(frequency,time);envelope.gain.setValueAtTime(level,time);envelope.gain.exponentialRampToValueAtTime(.0001,time+duration);source.connect(filter);filter.connect(envelope);envelope.connect(sfxBus);sfxVoices++;source.onended=()=>{sfxVoices=Math.max(0,sfxVoices-1);source.disconnect();filter.disconnect();envelope.disconnect()};source.start(time);source.stop(time+duration+.01)}
function scheduleDrum(step,time,boss){const kick=boss?(step===0||step===6||step===8||step===14):(step===0||step===8);const snare=step===4||step===12;if(kick)scheduleTone(45,time,.13,'triangle',.11,musicBus,110);if(snare)scheduleNoise(time,.12,.045,'bandpass',1800);if(step%2===0)scheduleNoise(time,.035,boss?.017:.012,'highpass',6500)}
function scheduleStep(index,time,boss){const step=index%16,bar=Math.floor(index/16),root=[40,36,43,38][bar%4],arp=[0,7,12,7][Math.floor(step/2)%4];if(step%4===0){const beat=step/4;scheduleTone(root+[0,7,12,7][beat],time,.29,'triangle',boss?.085:.07);}
 if(step%2===0){scheduleTone(root+12+arp,time,.15,'square',boss?.045:.032);const melody=(boss?bossPatterns:musicPatterns)[bar%4][step];if(melody!==null)scheduleTone(64+melody+(boss?12:0),time,.17,'square',boss?.075:.06);}
 scheduleDrum(step,time,boss)}
function schedulerTick(){if(!audioContext||!gameActive||!prefs.music)return;const horizon=audioContext.currentTime+.12;const sixteenth=60/164/4;while(nextStepTime<horizon){if(pendingBoss!==null&&stepIndex%16===0){bossMode=pendingBoss;pendingBoss=null}scheduleStep(stepIndex,nextStepTime,bossMode);nextStepTime+=sixteenth;stepIndex++}}
function startMusic(){if(!audioContext||scheduler||!gameActive||!prefs.music)return;const now=audioContext.currentTime;musicBus.gain.cancelScheduledValues(now);musicBus.gain.setTargetAtTime(.48,now,.04);stepIndex=0;nextStepTime=now+.04;scheduler=setInterval(schedulerTick,25);schedulerTick()}
function stopMusic(){if(scheduler){clearInterval(scheduler);scheduler=null}if(audioContext&&musicBus){const now=audioContext.currentTime;musicBus.gain.cancelScheduledValues(now);musicBus.gain.setTargetAtTime(.0001,now,.035)}}
function sequence(notes,spacing=.105,wave='square',level=.09){if(!audioContext||!prefs.sfx)return;const start=audioContext.currentTime+.008;notes.forEach((note,index)=>scheduleTone(note,start+index*spacing,spacing*.9,wave,level,sfxBus))}
function play(name){if(!audioContext||!prefs.sfx)return;const t=audioContext.currentTime+.004;switch(name){case'slash':scheduleNoise(t,.075,.09,'highpass',1500);scheduleTone(78,t,.105,'triangle',.045,sfxBus,42);break;case'hit':scheduleNoise(t,.09,.13,'lowpass',900);scheduleTone(48,t,.085,'square',.07,sfxBus,34);break;case'death':sequence([76,69,62,55],.075,'square',.07);break;case'jump':scheduleTone(60,t,.15,'triangle',.075,sfxBus,78);break;case'dash':scheduleNoise(t,.13,.075,'bandpass',1300);scheduleTone(82,t,.13,'sawtooth',.045,sfxBus,48);break;case'pickup':sequence([72,79,84,91],.075,'square',.065);break;case'legendary':sequence([64,71,76,79,83,88,95,100],.11,'square',.075);break;case'damage':scheduleNoise(t,.16,.17,'lowpass',700);scheduleTone(58,t,.16,'square',.1,sfxBus,35);break;case'heal':sequence([60,67,72,76,79],.085,'triangle',.07);break;case'boss':sequence([48,48,55,51,48],.17,'sawtooth',.075);scheduleTone(36,t,.72,'triangle',.11,sfxBus,28);break}}
function gameOver(){gameActive=false;stopMusic();sequence([76,72,69,65,64,60,57,52],.19,'triangle',.08)}
musicButton.addEventListener('click',()=>{prefs.music=!prefs.music;savePrefs();updateControls();if(prefs.music){unlock();if(gameActive)startMusic()}else stopMusic()});
sfxButton.addEventListener('click',()=>{prefs.sfx=!prefs.sfx;savePrefs();updateControls();unlock()});
volumeSlider.addEventListener('input',()=>{prefs.volume=Number(volumeSlider.value)/100;if(master)master.gain.setTargetAtTime(prefs.volume,audioContext.currentTime,.015)});
volumeSlider.addEventListener('change',savePrefs);
window.KnightAudio={play,setActive(value){gameActive=value;if(value){bossMode=false;pendingBoss=null;if(prefs.music)startMusic()}else stopMusic()},setBoss(value){if(value===bossMode&&pendingBoss===null)return;pendingBoss=value},gameOver,unlock};
})();
</script>
<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),pickupBtn=document.getElementById('pickup');let W=0,H=0,ground=0,scale=1;function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ground=H-Math.max(95,Math.min(150,H*.19));}addEventListener('resize',resize);resize();
const weapons=[{name:'Iron Sword',color:'#cdd6e6',damage:10,reach:62,rate:.38,weight:50},{name:'Flame Sword',color:'#ff7733',damage:20,reach:68,rate:.4,weight:15,burn:true},{name:'Frost Sword',color:'#7eeeff',damage:18,reach:100,rate:.44,weight:15,slow:true},{name:'Thunder Sword',color:'#c2a2ff',damage:30,reach:76,rate:.22,weight:15,chain:true},{name:'Excalibur',color:'#ffe177',damage:50,reach:125,rate:.32,weight:5}];const keys={};let player,enemies,drops,particles,score,kills,elapsed,spawnTimer,dropTimer,bossTimer,active=false,last=0,camera=0,shake=0,uid=0;
function reset(){player={x:0,y:0,vy:0,vx:0,face:1,hp:100,maxhp:100,weapon:weapons[0],cool:0,swing:0,inv:0,dash:0,dashCd:0,grounded:true};enemies=[];drops=[];particles=[];score=0;kills=0;elapsed=0;spawnTimer=1;dropTimer=6;bossTimer=180;camera=0;shake=0;uid=0;active=true;overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)}document.getElementById('start').onclick=reset;
const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',KeyW:'jump',ArrowUp:'jump',KeyJ:'attack',KeyK:'dash',KeyE:'pickup'};addEventListener('keydown',e=>{const k=map[e.code];if(k){e.preventDefault();if(k==='pickup'&&!e.repeat)collect();keys[k]=true;}});addEventListener('keyup',e=>{const k=map[e.code];if(k)keys[k]=false;});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;if(k==='pickup')collect();b.setPointerCapture?.(e.pointerId)};const off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});pickupBtn.onclick=collect;
function randomWeapon(){let r=Math.random()*100;for(const w of weapons){r-=w.weight;if(r<0)return w}return weapons[0]}function addDrop(x,y,kind='weapon'){drops.push({x,y,kind,weapon:kind==='weapon'?randomWeapon():null,ttl:20,phase:Math.random()*7})}function collect(){if(!active)return;let best=null,dist=70;for(const d of drops){let a=Math.abs(d.x-player.x);if(a<dist){dist=a;best=d}}if(best){if(best.kind==='weapon')player.weapon=best.weapon;else player.hp=Math.min(100,player.hp+30);drops.splice(drops.indexOf(best),1);burst(player.x,ground-40,best.kind==='weapon'?best.weapon.color:'#65fa91',18)}}
function spawnEnemy(boss=false){const side=Math.random()<.5?-1:1;let type=boss?'Demon Boss':(['Skeleton','Goblin','Dark Knight'][Math.floor(Math.random()*3)]);let stats=type==='Goblin'?[30,105,8,15]:type==='Dark Knight'?[85,49,17,25]:type==='Demon Boss'?[650,37,27,52]:[45,65,11,19];const hp=stats[0]*(1+elapsed/350);enemies.push({id:uid++,x:player.x+side*(W*.7+100),y:ground,vx:0,hp,maxhp:hp,speed:stats[1],damage:stats[2],size:stats[3],type,cool:0,hit:0,burn:0,slow:0,boss})}
function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*220,vy:(Math.random()-.7)*220,life:.4+Math.random()*.4,color})}function hurt(e,amount){e.hp-=amount;e.hit=.18;shake=5;burst(e.x,ground-e.size*1.4,player.weapon.color,7);if(player.weapon.burn)e.burn=2.5;if(player.weapon.slow)e.slow=2;if(e.hp<=0){score+=e.boss?500:10;kills++;burst(e.x,ground-e.size,e.boss?'#f44':'#e3d0ab',20);if(Math.random()<.25||e.boss)addDrop(e.x,ground-12);if(Math.random()<.1)addDrop(e.x+25,ground-12,'potion');e.dead=true}}
function attack(){if(player.cool>0)return;player.cool=player.weapon.rate;player.swing=.17;const targets=enemies.filter(e=>!e.dead&&Math.abs(e.x-player.x)<player.weapon.reach+e.size*.5&&Math.sign(e.x-player.x)===player.face);for(const e of targets)hurt(e,player.weapon.damage);if(player.weapon.chain&&targets.length){const origin=targets[0];const next=enemies.find(e=>!e.dead&&!targets.includes(e)&&Math.abs(e.x-origin.x)<115);if(next)hurt(next,Math.round(player.weapon.damage*.55))}}
function update(dt){elapsed+=dt;player.cool=Math.max(0,player.cool-dt);player.swing=Math.max(0,player.swing-dt);player.inv=Math.max(0,player.inv-dt);player.dashCd=Math.max(0,player.dashCd-dt);player.dash=Math.max(0,player.dash-dt);if(keys.dash&&player.dashCd<=0){player.dash=.17;player.dashCd=1.2;player.inv=Math.max(player.inv,.2)}const direction=(keys.right?1:0)-(keys.left?1:0);if(direction)player.face=direction;player.vx=player.dash>0?player.face*750:direction*240;if(keys.jump&&player.grounded){player.vy=-510;player.grounded=false}player.vy+=1250*dt;player.y+=player.vy*dt;if(player.y>=0){player.y=0;player.vy=0;player.grounded=true}player.x+=player.vx*dt;if(keys.attack)attack();spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy();spawnTimer=Math.max(.45,2.3-elapsed/125)}dropTimer-=dt;if(dropTimer<=0){addDrop(player.x+(Math.random()-.5)*Math.min(W,700),ground-12);dropTimer=10+Math.random()*5}bossTimer-=dt;if(bossTimer<=0){spawnEnemy(true);bossTimer=180}
for(const e of enemies){if(e.dead)continue;e.cool=Math.max(0,e.cool-dt);e.hit=Math.max(0,e.hit-dt);e.slow=Math.max(0,e.slow-dt);if(e.burn>0){e.burn-=dt;e.hp-=5*dt;if(e.hp<=0){e.dead=true;score+=10;kills++;burst(e.x,ground-e.size,'#ff6c28',12)}}let dist=player.x-e.x;if(Math.abs(dist)>e.size+17){e.x+=Math.sign(dist)*e.speed*(e.slow>0?.4:1)*dt}else if(e.cool<=0){e.cool=e.boss?1.25:1;if(player.inv<=0){player.hp=Math.max(0,player.hp-e.damage);player.inv=.65;shake=9;burst(player.x,ground-42,'#fa5555',12)}}}
enemies=enemies.filter(e=>!e.dead&&Math.abs(e.x-player.x)<W*2);for(const d of drops)d.ttl-=dt;drops=drops.filter(d=>d.ttl>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-35*dt);camera+=(player.x-W*.5-camera)*Math.min(1,dt*5);document.getElementById('hpfill').style.width=player.hp+'%';document.getElementById('score').textContent='คะแนน '+score+' • ฆ่า '+kills;document.getElementById('weapon').textContent='⚔️ '+player.weapon.name;document.getElementById('time').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');const near=drops.some(d=>Math.abs(d.x-player.x)<70);pickupBtn.style.display=near?'block':'none';const boss=enemies.find(e=>e.boss);document.getElementById('bossbar').style.display=boss?'block':'none';if(boss)document.getElementById('bossfill').style.width=Math.max(0,boss.hp/boss.maxhp*100)+'%';if(player.hp<=0){active=false;overlay.style.display='grid';overlay.innerHTML=`<h1>GAME OVER</h1><p>คะแนน ${score} • กำจัด ${kills} ตัว • อยู่รอด ${Math.floor(elapsed)} วินาที</p><p>สถิติสูงสุด ${Math.max(score,Number(localStorage.getItem('knightBest')||0))}</p><button id="restart">เล่นอีกครั้ง</button>`;localStorage.setItem('knightBest',Math.max(score,Number(localStorage.getItem('knightBest')||0)));document.getElementById('restart').onclick=reset}}
function drawKnight(x,y,size,color,enemy=false){ctx.save();ctx.translate(x,y);if(!enemy&&player.inv>0&&Math.floor(elapsed*20)%2)ctx.globalAlpha=.45;ctx.fillStyle='#111728';ctx.fillRect(-size*.45,-size*1.7,size*.9,size*1.7);ctx.fillStyle=color;ctx.fillRect(-size*.36,-size*1.6,size*.72,size*.85);ctx.fillStyle=enemy?'#25202b':'#c6cbd6';ctx.fillRect(-size*.39,-size*2.12,size*.78,size*.62);ctx.fillStyle=enemy?'#fa5555':'#151d32';ctx.fillRect(-size*.28,-size*1.87,size*.56,size*.12);ctx.fillStyle=enemy?'#4a253c':'#ae2944';ctx.beginPath();ctx.moveTo(-size*.35,-size*1.55);ctx.lineTo(-size*.8,-size*.25);ctx.lineTo(-size*.1,-size*.55);ctx.fill();ctx.fillStyle='#161b2e';ctx.fillRect(-size*.35,-size*.48,size*.25,size*.48);ctx.fillRect(size*.12,-size*.48,size*.25,size*.48);ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#10142d');sky.addColorStop(1,'#353653');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#f4e5b0';ctx.beginPath();ctx.arc(W*.8,H*.18,38,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1b223c';for(let i=-2;i<12;i++){let x=i*180-((camera*.13)%180);ctx.fillRect(x,ground-160,110,160);ctx.fillRect(x+20,ground-210,55,65);ctx.fillRect(x+38,ground-240,20,35)}ctx.save();ctx.translate(-camera+(Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.fillStyle='#283044';ctx.fillRect(camera-100,ground,W+200,H-ground);ctx.fillStyle='#59616d';ctx.fillRect(camera-100,ground,W+200,8);for(let i=Math.floor((camera-100)/55);i<(camera+W+100)/55;i++){ctx.fillStyle=i%2?'#32394c':'#353d50';ctx.fillRect(i*55,ground+9,52,30)}for(const d of drops){let y=d.y+Math.sin(elapsed*4+d.phase)*7;ctx.save();ctx.translate(d.x,y);ctx.rotate(-.6);ctx.shadowBlur=17;ctx.shadowColor=d.kind==='weapon'?d.weapon.color:'#55ff80';ctx.fillStyle=d.kind==='weapon'?d.weapon.color:'#55ff80';if(d.kind==='weapon'){ctx.fillRect(-4,-21,8,32);ctx.fillRect(-14,7,28,5)}else{ctx.fillRect(-9,-12,18,22);ctx.fillStyle='#fff';ctx.fillRect(-4,-18,8,6)}ctx.restore()}for(const e of enemies){drawKnight(e.x,ground,e.size,e.hit>0?'#fff':e.boss?'#84324d':e.type==='Goblin'?'#6d9d55':'#85818e',true);ctx.fillStyle='#1d1725';ctx.fillRect(e.x-25,ground-e.size*2.6,50,5);ctx.fillStyle='#e45d60';ctx.fillRect(e.x-25,ground-e.size*2.6,50*Math.max(0,e.hp/e.maxhp),5)}drawKnight(player.x,ground+player.y,27,'#9da9ba');ctx.save();ctx.translate(player.x+player.face*19,ground+player.y-37);ctx.rotate(player.face*(player.swing>0?-1.2:.4));ctx.fillStyle=player.weapon.color;ctx.shadowBlur=player.swing>0?20:4;ctx.shadowColor=player.weapon.color;ctx.fillRect(-4,-player.weapon.reach*.65,8,player.weapon.reach*.75);ctx.fillStyle='#b08c53';ctx.fillRect(-12,0,24,5);ctx.restore();if(player.swing>0){ctx.strokeStyle=player.weapon.color;ctx.lineWidth=5;ctx.beginPath();ctx.arc(player.x,ground+player.y-40,player.weapon.reach*.75,player.face===1?-.95:Math.PI-.95,player.face===1?.9:Math.PI+.9,player.face===-1);ctx.stroke()}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;ctx.restore()}
const audio=window.KnightAudio;
const originalReset=reset;reset=function(){originalReset();audio.setBoss(false);audio.setActive(true)};document.getElementById('start').onclick=reset;
const originalAttack=attack;attack=function(){if(player&&player.cool<=0)audio.play('slash');originalAttack()};
const originalHurt=hurt;hurt=function(enemy,amount){const willDie=enemy.hp<=amount&&!enemy.dead;audio.play('hit');originalHurt(enemy,amount);if(willDie){enemy.audioDeath=true;audio.play('death')}};
const originalCollect=collect;collect=function(){if(!active)return;let target=null,distance=70;for(const drop of drops){const current=Math.abs(drop.x-player.x);if(current<distance){distance=current;target=drop}}originalCollect();if(target&&!drops.includes(target)){if(target.kind==='potion')audio.play('heal');else audio.play(target.weapon.name==='Excalibur'?'legendary':'pickup')}};
const originalSpawnEnemy=spawnEnemy;spawnEnemy=function(boss=false){originalSpawnEnemy(boss);if(boss)audio.play('boss')};
const originalUpdate=update;update=function(dt){const previousHp=player.hp,wasGrounded=player.grounded,dashReady=player.dashCd<=0,livingEnemies=enemies.slice();if(keys.jump&&wasGrounded)audio.play('jump');if(keys.dash&&dashReady)audio.play('dash');originalUpdate(dt);if(player.hp<previousHp)audio.play('damage');for(const enemy of livingEnemies)if(enemy.dead&&!enemy.audioDeath){enemy.audioDeath=true;audio.play('death')}if(previousHp>0&&player.hp<=0){audio.gameOver();return}audio.setBoss(enemies.some(enemy=>enemy.boss&&!enemy.dead))};
function loop(now){if(!active)return;const dt=Math.min((now-last)/1000,.033);last=now;update(dt);render();if(active)requestAnimationFrame(loop)}if(player)render();})();
</script></body></html>
